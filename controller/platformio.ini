; Julia-x2 Joy — handheld WiFi joystick controller for the julia-X2 robot.
; Firmware v1, Seeed XIAO ESP32C3, Arduino framework.
;
; First flash MUST be over USB (env:usb) so the board has OTA-capable firmware;
; after that use env:ota to flash wirelessly.
;
;   pio run -e usb -t upload        # USB
;   pio run -e ota -t upload        # WiFi (board must be on the same network)
;   pio device monitor              # serial console (USB)
;
; WiFi + OTA credentials live in secrets.ini (gitignored) — copy
; secrets.ini.example to secrets.ini and fill it in.

[platformio]
default_envs = usb
extra_configs = secrets.ini

[joy]
hostname = julia-x2-joy
fw_version = 1.1.0
; Robot (Arduino UNO Q) running the julia-X2 app: its IP, or <board-name>.local.
; Leave empty to disable the robot link. Dashboard port is 7000.
robot_host =
robot_port = 7000

[env]
platform = espressif32@6.12.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    olikraus/U8g2@2.36.18
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.4.2
build_flags =
    '-DFW_VERSION="${joy.fw_version}"'
    '-DOTA_HOSTNAME="${joy.hostname}"'
    '-DROBOT_HOST="${joy.robot_host}"'
    -DROBOT_PORT=${joy.robot_port}
    -DWEBSOCKETS_TCP_TIMEOUT=2000
    '-DWIFI_SSID="${secrets.wifi_ssid}"'
    '-DWIFI_PASSWORD="${secrets.wifi_password}"'
    '-DOTA_PASSWORD="${secrets.ota_password}"'

[env:usb]
; 921600 dropped mid-upload on this board ("Packet content transfer stopped")
upload_speed = 460800

[env:ota]
upload_protocol = espota
; mDNS name; if Windows can't resolve .local, override with the IP printed on boot:
;   pio run -e ota -t upload --upload-port 192.168.x.y
upload_port = ${joy.hostname}.local
upload_flags =
    --auth=${secrets.ota_password}
    --port=3232
